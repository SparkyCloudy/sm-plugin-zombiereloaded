project:
  sourceknight: 0.5
  name: zombiereloaded
  dependencies:
    - name: sourcemod
      type: smdrop
      version: 1.11
      unpack:
      - source: /addons
        dest: /addons
    - name: multicolors
      type: git
      repo: https://github.com/srcdslab/sm-plugin-MultiColors
      unpack:
      - source: /addons
        dest: /addons
    - name: AFKManager
      type: git
      repo: https://github.com/srcdslab/sm-plugin-AFKManager
      unpack:
      - source: /addons
        dest: /addons
    - name: TeamManager
      type: git
      repo: https://github.com/srcdslab/sm-plugin-TeamManager
      unpack:
      - source: /addons
        dest: /addons
  root: /src
  output: /src/addons/sourcemod/plugins
  targets:
    - zombiereloaded

