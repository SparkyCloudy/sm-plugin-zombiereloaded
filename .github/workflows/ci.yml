name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Sourceknight
        uses: SparkyCloudy/sourceknight@master
        with:
          cache: false

      - name: Build sourcemod plugin
        run: |
          sourceknight build

      - name: Create package
        run: |
          set -euo pipefail
          mkdir -p /tmp/package/addons/sourcemod/plugins
          cp src/addons/sourcemod/plugins/*.smx /tmp/package/addons/sourcemod/plugins/
          if [ -d "common" ]; then
            cp -R common/* /tmp/package/
          fi
      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}
          path: /tmp/package
  tag:
    name: Tag
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing "latest" release and tag
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: rickstaa/action-create-tag@v1
        with:
          tag: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: [build, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ runner.os }}
          path: artifacts
      - name: Versioning
        run: |
          set -euo pipefail
          version="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Package
        run: |
          set -euo pipefail
          cd artifacts
          tar -czf "../${{ github.event.repository.name }}-${{ env.RELEASE_VERSION }}.tar.gz" .
          cd ..
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.gz"
          tag: ${{ env.RELEASE_VERSION }}
          file_glob: true
          overwrite: true
